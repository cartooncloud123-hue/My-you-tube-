.back{

        </span>

  </button>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  query,
  where,
  addDoc,
  deleteDoc,
  updateDoc,
  increment,
  setDoc,
  orderBy,
  limit,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDWlmSOewJUk5z2An5Qeabx7AB_AwjFPVc",

  authDomain:
    "rsm-video-486d6.firebaseapp.com",

  projectId:
    "rsm-video-486d6",

  storageBucket:
    "rsm-video-486d6.firebasestorage.app",

  messagingSenderId:
    "1022944379126",

  appId:
    "1:1022944379126:web:e3bbf6a341feb47a8d6cd7",

  measurementId:
    "G-0D39KPEK4B"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);


/* =========================
   CHANNEL UID
========================= */

const CHANNEL_UID =
  "pN3h0cth5qd3kX13RfJF2UQrYuo2";


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let channelRef = null;

let isSubscribed = false;

let subscriptionId = null;


/* =========================
   ELEMENTS
========================= */

const channelName =
  document.getElementById(
    "channelName"
  );

const handle =
  document.getElementById(
    "handle"
  );

const subscriberCount =
  document.getElementById(
    "subscriberCount"
  );

const description =
  document.getElementById(
    "description"
  );

const subscribeBtn =
  document.getElementById(
    "subscribeBtn"
  );

const loginInfo =
  document.getElementById(
    "loginInfo"
  );

const videoList =
  document.getElementById(
    "videoList"
  );

const notifyBtn =
  document.getElementById(
    "notifyBtn"
  );

const notificationBox =
  document.getElementById(
    "notificationBox"
  );

const notificationList =
  document.getElementById(
    "notificationList"
  );


/* =========================
   GET CHANNEL
========================= */

async function getOrCreateChannel(){

  const directRef =
    doc(
      db,
      "channels",
      CHANNEL_UID
    );


  let snap =
    await getDoc(
      directRef
    );


  /*
    Channel મળી ગયો
  */

  if(snap.exists()){

    channelRef =
      directRef;

    return snap.data();

  }


  /*
    UID fieldથી શોધો
  */

  const q =
    query(
      collection(
        db,
        "channels"
      ),

      where(
        "userId",
        "==",
        CHANNEL_UID
      ),

      limit(1)
    );


  const result =
    await getDocs(q);


  if(!result.empty){

    channelRef =
      result.docs[0].ref;

    return result.docs[0].data();

  }


  /*
    Channel ન હોય તો
    નવો channel બનાવો
  */

  if(currentUser){

    await setDoc(
      directRef,
      {

        userId:
          CHANNEL_UID,

        channelName:
          "RSM VIDEO",

        handle:
          "@rsmvideo",

        description:
          "RSM VIDEO Official Channel 🎬",

        subscribers:
          0,

        createdAt:
          new Date().toISOString()

      }
    );


    channelRef =
      directRef;


    snap =
      await getDoc(
        directRef
      );


    return snap.data();

  }


  return {

    userId:
      CHANNEL_UID,

    channelName:
      "RSM VIDEO",

    handle:
      "@rsmvideo",

    description:
      "RSM VIDEO Official Channel 🎬",

    subscribers:
      0

  };

}


/* =========================
   LOAD CHANNEL
========================= */

async function loadChannel(){

  try{

    const data =
      await getOrCreateChannel();


    channelName.textContent =
      data.channelName ||
      "RSM VIDEO";


    handle.textContent =
      data.handle ||
      "@rsmvideo";


    description.textContent =
      data.description ||
      "RSM VIDEO Official Channel 🎬";


    subscriberCount.textContent =
      data.subscribers || 0;

  }
  catch(error){

    console.error(error);

    alert(
      "❌ Channel Error:\n" +
      error.message
    );

  }

}


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    if(user){

      loginInfo.textContent =
        "✅ Login: " +
        (
          user.email ||
          "User"
        );

    }
    else{

      loginInfo.textContent =
        "🔐 Subscribe કરવા માટે Login કરો.";

    }


    await loadChannel();


    if(user){

      await checkSubscription();

    }

  }
);


/* =========================
   CHECK SUBSCRIPTION
========================= */

async function checkSubscription(){

  if(!currentUser){

    return;

  }


  try{

    const q =
      query(

        collection(
          db,
          "subscriptions"
        ),

        where(
          "subscriberId",
          "==",
          currentUser.uid
        ),

        where(
          "channelOwnerId",
          "==",
          CHANNEL_UID
        ),

        limit(1)

      );


    const snapshot =
      await getDocs(q);


    if(!snapshot.empty){

      subscriptionId =
        snapshot.docs[0].id;

      isSubscribed =
        true;


      subscribeBtn.textContent =
        "✅ Subscribed";


      subscribeBtn.classList.add(
        "subscribed"
      );

    }
    else{

      subscriptionId =
        null;

      isSubscribed =
        false;


      subscribeBtn.textContent =
        "🔔 Subscribe";


      subscribeBtn.classList.remove(
        "subscribed"
      );

    }

  }
  catch(error){

    console.error(error);

  }

}


/* =========================
   SUBSCRIBE
========================= */

subscribeBtn.addEventListener(
  "click",
  async()=>{

    if(!currentUser){

      alert(
        "🔐 Subscribe કરવા માટે Login કરો."
      );

      window.location.href =
        "login.html";

      return;

    }


    /*
      પોતાનું channel
    */

    if(
      currentUser.uid ===
      CHANNEL_UID
    ){

      alert(
        "⚠️ તમે તમારા પોતાના Channel ને Subscribe કરી શકતા નથી."
      );

      return;

    }


    subscribeBtn.disabled =
      true;


    try{

      const data =
        await getOrCreateChannel();


      if(isSubscribed){

        /*
          UNSUBSCRIBE
        */

        if(subscriptionId){

          await deleteDoc(
            doc(
              db,
              "subscriptions",
              subscriptionId
            )
          );

        }


        await updateDoc(
          channelRef,
          {
            subscribers:
              increment(-1)
          }
        );


        isSubscribed =
          false;

        subscriptionId =
          null;


        subscribeBtn.textContent =
          "🔔 Subscribe";


        subscribeBtn.classList.remove(
          "subscribed"
        );


        const oldCount =
          Number(
            subscriberCount.textContent
          ) || 0;


        subscriberCount.textContent =
          Math.max(
            0,
            oldCount - 1
          );

      }
      else{

        /*
          DUPLICATE CHECK
        */

        const check =
          query(

            collection(
              db,
              "subscriptions"
            ),

            where(
              "subscriberId",
              "==",
              currentUser.uid
            ),

            where(
              "channelOwnerId",
              "==",
              CHANNEL_UID
            ),

            limit(1)

          );


        const existing =
          await getDocs(check);


        if(
          !existing.empty
        ){

          subscriptionId =
            existing.docs[0].id;

          isSubscribed =
            true;

        }
        else{

          const newSub =
            await addDoc(
              collection(
                db,
                "subscriptions"
              ),
              {

                subscriberId:
                  currentUser.uid,

                subscriberEmail:
                  currentUser.email ||
                  "",

                channelOwnerId:
                  CHANNEL_UID,

                createdAt:
                  new Date().toISOString()

              }
            );


          subscriptionId =
            newSub.id;

          isSubscribed =
            true;


          /*
            CREATE NOTIFICATION
          */

          await addDoc(
            collection(
              db,
              "notifications"
            ),
            {

              type:
                "new_subscriber",

              channelOwnerId:
                CHANNEL_UID,

              subscriberId:
                currentUser.uid,

              subscriberEmail:
                currentUser.email ||
                "",

              message:
                (
                  currentUser.email ||
                  "Someone"
                ) +
                " subscribed to your channel 🎉",

              read:
                false,

              createdAt:
                serverTimestamp()

            }
          );

        }


        /*
          Subscriber count
        */

        await updateDoc(
          channelRef,
          {
            subscribers:
              increment(1)
          }
        );


        subscribeBtn.textContent =
          "✅ Subscribed";


        subscribeBtn.classList.add(
          "subscribed"
        );


        const oldCount =
          Number(
            subscriberCount.textContent
          ) || 0;


        subscriberCount.textContent =
          oldCount + 1;

      }


    }
    catch(error){

      console.error(error);

      alert
