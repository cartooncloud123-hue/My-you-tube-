<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RSM Video - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: red;
    }

    .login-box {
      width: 92%;
      max-width: 420px;
      margin: 55px auto;
      background: #181818;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 5px 30px rgba(0,0,0,0.5);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 9px;
      background: #101010;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: red;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 9px;
      background: #ff0000;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .login-btn {
      background: #333;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      min-height: 20px;
      color: #ddd;
    }

    .home {
      display: block;
      text-align: center;
      color: #aaa;
      text-decoration: none;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">▶ <span>RSM</span> Video</div>
  </header>


  <div class="login-box">

    <h1>👤 Login</h1>

    <p class="subtitle">
      RSM Videoમાં Login કરો
    </p>

    <input
      type="email"
      id="email"
      placeholder="તમારું Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="signup()">
      📝 Create Account
    </button>

    <button class="login-btn" onclick="login()">
      🔐 Login
    </button>

    <p id="message"></p>

    <a class="home" href="index.html">
      ← Home પર પાછા જાઓ
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


    // 🔥 YOUR FIREBASE CONFIG

    const firebaseConfig = {
      apiKey: "AIzaSyDWlmSOewJUk5z2An5Qeabx7AB_AwjFPVc",
      authDomain: "rsm-video-486d6.firebaseapp.com",
      projectId: "rsm-video-486d6",
      storageBucket: "rsm-video-486d6.firebasestorage.app",
      messagingSenderId: "1022944379126",
      appId: "1:1022944379126:web:e3bbf6a341feb47a8d6cd7",
      measurementId: "G-0D39KPEK4B"
    };


    // Firebase Start

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Message

    function showMessage(text) {

      document.getElementById("message").innerText = text;

    }


    // Create Account

    window.signup = async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage("⚠️ Email અને Password નાખો.");

        return;
      }


      if (password.length < 6) {

        showMessage(
          "⚠️ Password ઓછામાં ઓછો 6 charactersનો હોવો જોઈએ."
        );

        return;
      }


      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "✅ Account successfully created!"
        );

      } catch (error) {

        console.log(error);

        if (error.code === "auth/email-already-in-use") {

          showMessage(
            "⚠️ આ Emailથી Account પહેલેથી છે. Login કરો."
          );

        } else {

          showMessage(
            "❌ " + error.message
          );

        }

      }

    };


    // Login

    window.login = async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "⚠️ Email અને Password નાખો."
        );

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "✅ Login Successful!"
        );


        setTimeout(() => {

          window.location.href = "index.html";

        }, 1000);


      } catch (error) {

        console.log(error);

        showMessage(
          "❌ Email અથવા Password ખોટો છે."
        );

      }

    };

  </script>

</body>
</html>
